"aqua:modem-dev/hunk" = "0.24.1"
"aqua:pnpm/pnpm" = "12.16.1"                 # npm backend (bun) skips pnpm's postinstall, leaving a shebang-less shim that macOS posix_spawn rejects
"aqua:suzuki-shunsuke/ghalint" = "1.5.7"
"aqua:suzuki-shunsuke/pinact" = "5.0.2"
"aqua:sxyazi/yazi" = "26.9.1"
"aqua:zizmorcore/zizmor" = "1.31.1"

# cargo: tools
"cargo:cargo-clean-all" = "0.6.6"
"cargo:treemd" = "0.10.0"

# github: tools
"github:rysk-tanaka/csvr" = "0.2.0"
# Apple Intelligence backend for auto-commit/suggest-branch; release ships arm64 macOS only,
# so gate with os to keep `mise install` working on Intel macOS / Linux clones
"github:rysk-tanaka/rintel" = { version = "0.3.0", os = ["macos/arm64"] }
# global wakatime-cli stops claude-code-wakatime's unauthenticated GitHub API version polling
"github:wakatime/wakatime-cli" = "2.28.0"

# npm: tools
"npm:aws-cdk" = "2.1146.1"
"npm:cc-sdd" = "3.1.0"
"npm:ccmanager" = "4.4.10"
"npm:ccusage" = "20.0.45"                     # 18.0.6 has runtime: protocol dep (incompatible with npm/bun global install)
"npm:@ccusage/codex" = "19.0.0"              # 18.0.6 has runtime: protocol dep (incompatible with npm/bun global install)
"npm:claude-code-templates" = "1.30.0"
"npm:@github/copilot" = "1.0.104"
"npm:markdownlint-cli2" = "0.24.0"
"npm:md-mermaid-lint" = "1.0.1"
"npm:opencommit" = "3.3.11"
"npm:pyright" = "1.1.414"

[env]
DOTFILES_PATH = "/Users/rysk/Repositories/rysk/dotfiles"
# LM Studio on the Mac mini (Tailscale)
# LM_API_TOKEN_COMMAND is the token convention of rysk-tanaka/skills, because
# - LM_API_TOKEN is rejected by the LM Studio SDK unless it is a raw sk-lm- token
# - resolving the token here would run `op` on every shell
# Overridden on the LM Studio host by the untracked config.local.toml (see README)
LM_API_URL = "http://m6m:1234"
LM_API_TOKEN_COMMAND = "op read 'op://work/LM Studio m6m/credential'"

[tasks.lint]
# Global tasks default to config_root ($HOME) as cwd; without this, running
# `mise run lint` with no paths would ruff-format the entire home directory
dir = "{{cwd}}"
usage = 'arg "[paths]" var=#true help="Lint target paths"'
# Only Python files and directories are kept so that `git diff --name-only`
# output can be passed as-is: ruff parses any explicit file as Python, and mypy
# treats each non-.py file argument as `__main__`
run = '''
set -e
paths=""
for p in ${usage_paths:-}; do
  case "$p" in
    *.py|*.pyi) paths="$paths $p" ;;
    *) [ -d "$p" ] && paths="$paths $p" ;;
  esac
done
# Skip instead of falling back to the whole directory when every path was excluded
if [ -n "${usage_paths:-}" ] && [ -z "$paths" ]; then
  echo "lint: no Python target paths"
  exit 0
fi
uv run --with ruff -- ruff format $paths
uv run --with ruff -- ruff check $paths
uv run --with mypy -- mypy ${paths:-.}
uv run --with ty -- ty check $paths
uv run --with pyright -- pyright $paths
'''

[settings]

[settings.npm]
package_manager = "bun"
