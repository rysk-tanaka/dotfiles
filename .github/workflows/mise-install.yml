name: mise install

on:
  pull_request:

jobs:
  mise-install:
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            config:
              - '.config/mise/config.toml'

      - name: Checkout repository
        if: steps.changes.outputs.config == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        if: steps.changes.outputs.config == 'true'
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true

      # mise reads .config/mise/config.toml relative to the working
      # directory (repo root after checkout), not ~/.config/mise/.
      - name: Verify tool installation
        if: steps.changes.outputs.config == 'true'
        env:
          MISE_HTTP_TIMEOUT: 120
        run: mise install
